document.body.insertAdjacentHTML("beforeend", "\n<div class=\"gate\" id=\"gate\" style=\"display:none\">\n  <div class=\"gatecard\">\n    <p class=\"geyebrow\">二人対戦・13点先取<\/p>\n    <h1 class=\"gtitle\">十三星の盤<\/h1>\n\n    <div class=\"gsec\" id=\"gRoomSec\">\n      <p class=\"glabel\">友達と対戦する<\/p>\n      <p class=\"ghint\" id=\"gRoomHint\">ふたりで同じ合言葉を入れると、同じ卓に着きます。相手にはこのページのURLと合言葉を伝えてください。<\/p>\n      <div class=\"grow\">\n        <input type=\"text\" id=\"gWord\" autocomplete=\"off\" spellcheck=\"false\"\n               placeholder=\"合言葉\" maxlength=\"24\" aria-label=\"合言葉\">\n        <button type=\"button\" id=\"gJoin\" class=\"primary\">卓に着く<\/button>\n      <\/div>\n      <button type=\"button\" id=\"gMake\" class=\"ghost\">合言葉を作ってもらう<\/button>\n    <\/div>\n\n    <div class=\"gsec\" id=\"gArtSec\" style=\"display:none\">\n      <p class=\"glabel\">友達と対戦する<\/p>\n      <p class=\"ghint\">このページ自体がひとつの卓です。同じURLを開いた人と対戦できます。<\/p>\n      <button type=\"button\" id=\"gArt\" class=\"primary wide\">このページで対戦する<\/button>\n    <\/div>\n\n    <div class=\"gor\"><span>または<\/span><\/div>\n\n    <div class=\"gsec\">\n      <p class=\"glabel\">ひとりで指す<\/p>\n      <div class=\"grow3\">\n        <button type=\"button\" id=\"gCpu1\">やさしい<\/button>\n        <button type=\"button\" id=\"gCpu2\">強い<\/button>\n        <button type=\"button\" id=\"gCpu0\">1台でふたり<\/button>\n      <\/div>\n    <\/div>\n\n    <details class=\"gadv\" id=\"gAdv\">\n      <summary>詳細設定<\/summary>\n      <div class=\"gadvbody\">\n        <p class=\"glabel2\">移動ルール<\/p>\n        <div class=\"seg\" id=\"gSeg\">\n          <button type=\"button\" id=\"gModeStep\" aria-pressed=\"true\">A ／ 1歩<\/button>\n          <button type=\"button\" id=\"gModeSlide\" aria-pressed=\"false\">B ／ 行き当たり<\/button>\n          <button type=\"button\" id=\"gModeFree\" aria-pressed=\"false\" style=\"display:none\">C ／ 自由<\/button>\n        <\/div>\n        <p class=\"ghint\" id=\"gModeWhy\"><\/p>\n\n        <p class=\"glabel2\">持ち時間<\/p>\n        <button type=\"button\" id=\"gClkOn\" class=\"wide\" aria-pressed=\"false\">持ち時間なし<\/button>\n        <div class=\"clkgrid\">\n          <select id=\"gClkBase\" aria-label=\"ひとりの持ち時間\">\n            <option value=\"180\">3分<\/option><option value=\"300\">5分<\/option>\n            <option value=\"600\">10分<\/option><option value=\"900\">15分<\/option>\n            <option value=\"1800\">30分<\/option><option value=\"3600\">60分<\/option>\n          <\/select>\n          <select id=\"gClkInc\" aria-label=\"1手ごとの加算\">\n            <option value=\"0\">加算なし<\/option><option value=\"3\">3秒 加算<\/option>\n            <option value=\"5\">5秒 加算<\/option><option value=\"10\">10秒 加算<\/option>\n            <option value=\"30\">30秒 加算<\/option>\n          <\/select>\n        <\/div>\n\n        <p class=\"glabel2\">得点になる役<\/p>\n        <ul class=\"rt-list\" id=\"gToggles\"><\/ul>\n        <button type=\"button\" id=\"gPreset\" class=\"wide\">推奨設定に戻す<\/button>\n        <p class=\"ghint\">卓を建てた人の設定が、相手にもそのまま伝わります。<\/p>\n      <\/div>\n    <\/details>\n\n    <p class=\"gmsg\" id=\"gMsg\" style=\"display:none\"><\/p>\n    <p class=\"gfoot\">ルールは盤の下にすべて書いてあります。見出しの下の「最初に戻る」で、いつでもここへ戻れます。<\/p>\n  <\/div>\n<\/div>\n\n\n<div class=\"wrap\">\n  <header>\n    <h1>十三星の盤<\/h1>\n    <p class=\"sub\">二人対戦・13点先取。4つの持ち駒のうち1つが王です。役が成立すると得点が入り、攻守を交代して次のラウンドへ進みます。<\/p>\n    <button type=\"button\" id=\"homeBtn\" class=\"homebtn\">最初に戻る<\/button>\n  <\/header>\n\n  <div class=\"stage\">\n    <div class=\"boardcol\">\n      <div class=\"card board-card\">\n        <svg class=\"board\" id=\"board\" viewBox=\"0 0 580 580\" role=\"application\" aria-label=\"十三交点の盤\"><\/svg>\n\n        <div class=\"resbar\" id=\"resBar\" style=\"display:none\">\n          <span class=\"rw\" id=\"resWho\"><\/span>\n          <span class=\"rt\" id=\"resTxt\"><\/span>\n          <button type=\"button\" id=\"resOk\">了解<\/button>\n          <button type=\"button\" id=\"resGo\" style=\"display:none\">ひとりで進める<\/button>\n n        <button type=\"button\" id=\"clkOn\" class=\"wide\" aria-pressed=\"false\">持ち時間なし<\/button>\n        <div class=\"clkgrid\">\n          <select id=\"clkBase\" aria-label=\"ひとりの持ち時間\">\n            <option value=\"180\">3分<\/option>\n            <option value=\"300\">5分<\/option>\n            <option value=\"600\">10分<\/option>\n            <option value=\"900\">15分<\/option>\n            <option value=\"1800\">30分<\/option>\n            <option value=\"3600\">60分<\/option>\n          <\/select>\n          <select id=\"clkInc\" aria-label=\"1手ごとの加算\">\n            <option value=\"0\">加算なし<\/option>\n            <option value=\"3\">3秒 加算<\/option>\n            <option value=\"5\">5秒 加算<\/option>\n            <option value=\"10\">10秒 加算<\/option>\n            <option value=\"30\">30秒 加算<\/option>\n          <\/select>\n        <\/div>\n        <p class=\"why\" id=\"clkWhy\"><\/p>\n      <\/div>\n      <div class=\"card setting\">\n        <p class=\"eyebrow\">役の設定<\/p>\n        <ul class=\"rt-list\" id=\"ruleToggles\"><\/ul>\n        <button type=\"button\" id=\"preset\" class=\"wide\">推奨設定に戻す<\/button>\n        <p class=\"why\" id=\"ruleWhy\"><\/p>\n      <\/div>\n\n      <div class=\"card setting\">\n        <p class=\"eyebrow\">移動ルール<\/p>\n        <div class=\"seg\" id=\"seg\">\n          <button type=\"button\" id=\"modeFree\" aria-pressed=\"true\">C ／ 自由<\/button>\n          <button type=\"button\" id=\"modeStep\" aria-pressed=\"false\">A ／ 1歩<\/button>\n          <button type=\"button\" id=\"modeSlide\" aria-pressed=\"false\">B ／ 行き当たり<\/button>\n        <\/div>\n        <p class=\"why\" id=\"modeWhy\">線に沿って、駒に当たるまでの好きな交点へ動かします。1つでも端まででも構いません。<\/p>\n      <\/div>\n\n      <div class=\"card setting\" id=\"linkcard\" style=\"display:none\">\n        <p class=\"eyebrow\">リンク対戦<\/p>\n        <div id=\"linkStartBox\" class=\"netbox\">\n          <span class=\"netlabel\">手ごとにリンクを送り合います。相手はブラウザだけあれば遊べます<\/span>\n          <button type=\"button\" id=\"linkNew\" (function(){

    }

    if (a.t === "p"){
      P.m[me] |= 1<<a.i; P.h[me] -= 1;
      if (a.king){ P.k[me] = 1<<a.i; P.kh[me] = 0; }
    } else {
      var from = 1<<a.i, to = 1<<a.j;
      P.m[me] = (P.m[me] & ~from) | to;
      if (P.k[me] === from) P.k[me] = to;
    }

    // 早三星（反則）: どちらかの盤外にまだ駒が残っている状態で、内側の辺を揃えること。
    // 8個すべてが盤上に出れば、その手も含めて内三星として得点になる。
    // 置く手はすべて対象。8個目を置く瞬間も含む。全部出そろった後の移動でだけ解放される
    var handsLeft = (a.t === "p") || (P.h[1] > 0 || P.h[2] > 0);
    var bad = RULES.hayaSanzei ? innerHit(P.m[me]) : null;
    if (bad && handsLeft)
      return {P:P, ev:null, end:{scorer:foe, p:0, name:"早三星", foul:true, fouler:me, matchLoss:true,
        text:"早三星　" + bad.join("・") + "（駒を置いて内側の辺を揃えました）。得点に関係なく " + NAME[me] + " の負けです",
        pts:bad, shape:"line"}};

    var sc = scoreOf(P.m[me], P.k[me]);
    if (sc) return {P:P, ev:null, end:{scorer:me, p:sc.p, name:sc.name,
      text:sc.name + "　" + sc.pts.join("・"), pts:sc.pts, shape:sc.shape}};

    if (RULES.chuShiho && xFormed(P.m[me])){
      P.cap = me; P.next = foe;      // 没収するのは自分。選ぶのも自分
      return {P:P, ev:{trigger:{by:me}}, end:null};
    }

    P.turn = foe;
    return afterTurn(P, null);
  }

  function afterTurn(P, ev){
    var t = P.turn;
    if (P.h[t] === 0){
      var occ = P.m[1]|P.m[2], any = false;
      for (var i=0;i<13 && !any;i++) if (((P.m[t]>>i)&1) && destsOf(i, occ).length) any = true;
      if (!any) return {P:P, ev:ev, end:{scorer: t===1?2:1, p:SCORE.kousen, name:"手詰まり",
        text:"手詰まり　" + NAME[t] + "が動けません", pts:[], shape:"line"}};
    }
    return {P:P, ev:ev, end:null};
  }

  /* ===== 評価と探索 ===== */
  function threats(mine, foe, hand){
    var t=0, c=0, i;
    for (i=0;i<A_L3.length;i++){
      var L=A_L3[i].m;
      if ((mine & L) && POP[mine & L]===2 && !(foe & L)) t += 1;
    }
    if (RULES.hayaSanzei){
      for (i=0;i<INNERM.length;i++)
        if (hand>0 && POP[mine & INNERM[i]]===2 && !(foe & INNERM[i])) t -= 3;  // 早三星の危険
    }
    for (i=0;i<A_L5.length;i++){ var W=A_L5[i].m; if (POP[mine&W]===3 && !(foe&W)) t += 1; }
    for (i=0;i<A_SQ.length;i++){ var Q=A_SQ[i].m; if (POP[mine&Q]===3 && !(foe & Q)) t += 2; }
    if (RULES.chuShiho){
      var x = POP[mine & XSQ];
      if (x === 3 && !(foe & XSQ & ~mine)) c += 3;
      else if (x === 3) c += 1;
    }
    return t*10 + c*9;
  }
  function evaluate(P, me){
    var foe = me===1?2:1;
    var kingBonus = (P.k[me] ? 60 : 0) - (P.k[foe] ? 60 : 0);
    return 140*(tot(P,me)-tot(P,foe)) + kingBonus
         + threats(P.m[me], P.m[foe], P.h[me])
         - 1.15*threats(P.m[foe], P.m[me], P.h[foe]);
  }
  function endValue(end, me){
    if (end.matchLoss) return (end.fouler === me ? -1 : 1) * 200000;
    return (end.scorer === me ? 1 : -1) * end.p * 1000;
  }
  var INF = 1e9, nodes = 0, deadline = 0;

  function search(P, depth, alpha, beta, me){
    nodes++;
    if ((nodes & 511) === 0 && Date.now() > deadline) throw "timeout";
    var acts = legalActions(P);
    if (!acts.length) return P.turn === me ? -INF/2 : INF/2;
    if (depth <= 0) return evaluate(P, me);
    var maximizing = (P.cap ? P.cap : P.turn) === me;
    var best = maximizing ? -INF : INF, k;
    // 手の並べ替え: 没収と決まり手を先に
    for (k=0;k<acts.length;k++){
      var r = apply(P, acts[k]), s;
      if (r.end){
        s = endValue(r.end, me);
        s = s > 0 ? s - (10 - depth) : s + (10 - depth);
      } else {
        s = search(r.P, depth - 1, alpha, beta, me);
      }
      if (maximizing){ if (s > best) best = s; if (best > alpha) alpha = best; }
      else { if (s < best) best = s; if (best < beta) beta = best; }
      if (beta <= alpha) break;
    }
    return best;
  }

  function pickAction(P, maxDepth, ms){
    var me = P.cap ? P.cap : P.turn;
    var acts = legalActions(P);
    if (acts.length === 1) return acts[0];
    var best = acts[0], d;
    deadline = Date.now() + ms; nodes = 0;
    for (d = 1; d <= maxDepth; d++){
      try {
        var localBest = null, localScore = -INF, alpha = -INF;
        for (var k=0;k<acts.length;k++){
          var r = apply(P, acts[k]), s;
          if (r.end) s = endValue(r.end, me);
          else s = search(r.P, d - 1, alpha, INF, me);
          if (localBest === null || s > localScore){ localScore = s; localBest = acts[k]; }
          if (s > alpha) alpha = s;
        }
        best = localBest;
        if (localScore >= 5000) break;
      } catch(e){ break; }
    }
    return best;
  }

  /* ===== UI 状態 ===== */
  var S = { P:newPos(1), stack:[], log:[], end:null, pick:null, seen:{},
            lastMove:null, capInfo:null, cpu:2, level:1,
            pts:[0,0,0], round:1, first:1, placeKing:false, matchOver:null,
            drawStreak:0, drawCause:[0,0,0], matchNote:"",
            net:0, ply:0, lastCode:"", netMsg:"",
            srv:null, srvMsg:"", srvBusy:false,
            link:null, codes:[], linkMsg:"",
            auto:false, autoPending:false, autoBusy:false, autoOff:false,
            autoRO:false, autoDirty:false, autoMsg:"", watch:false,
            gate:true, room:false, roomMsg:"", roomErr:false,
            clkStamp:0, clkT0:0, clkWait:false, pause:null,
            roomBusy:false, roomDirty:false, artReady:false };

  // 盤は90度回転で自分自身に重なる。回転して同じなら同一局面として扱う
  var ROT = (function(){
    var rows={A:1,B:2,C:3,D:4,E:5}, inv=["","A","B","C","D","E"];
    var one = POINTS.map(function(p){
      var r = rows[p[0]], c = Number(p[1]);
      return IX[inv[c] + (6 - r)];              // (r,c) -> (c, 6-r)
    });
    var all=[POINTS.map(function(_,i){return i;})], cur=one;
    for (var t=0;t<3;t++){ all.push(cur.slice()); cur = cur.map(function(j){ return one[j]; }); }
    return all;
  })();
  function rotMask(m, perm){
    var r=0;
    for (var i=0;i<13;i++) if ((m>>i)&1) r |= 1<<perm[i];
    return r;
  }
  function posKey(P){
    var best=null;
    for (var t=0;t<ROT.length;t++){
      var pm=ROT[t];
      var k = rotMask(P.m[1],pm)+"/"+rotMask(P.m[2],pm)+"/"+rotMask(P.k[1],pm)+"/"+rotMask(P.k[2],pm)
            +"/"+P.h[1]+P.h[2]+"/"+P.turn+"/"+P.cap;
      if (best===null || k < best) best = k;
    }
    return best;
  }
  // いま指すと千日手になる手（同一局面3回目）を洗い出す。置く手は手駒が減るので繰り返しにならない
  function drawRiskMoves(){
    var out = [];
    if (S.end || S.P.cap) return out;
    var A = legalActions(S.P);
    for (var i=0;i<A.length;i++){
      var a = A[i];
      if (a.t !== "m") continue;
      var r = apply(S.P, a);
      if (r.end || r.P.cap) continue;
      var k = posKey(r.P);
      if ((S.seen[k] || 0) + 1 >= 3) out.push({from:POINTS[a.i], to:POINTS[a.j]});
    }
    return out;
  }
  function seenCount(){ return S.seen[posKey(S.P)] || 0; }
  function cutoffLoser(){
    return S.drawCause[1] > S.drawCause[2] ? 1
         : (S.drawCause[2] > S.drawCause[1] ? 2 : S.first0);
  }

  function humanTurn(){
    if (S.end || S.matchOver) return false;
    if (S.gate || S.autoPending || S.watch || S.autoBusy || S.roomBusy) return false;
    var actor = S.P.cap ? S.P.cap : S.P.turn;
    if (S.net) return actor === S.net;
    return S.cpu === 0 || actor !== S.cpu;
  }

  function encAction(a){
    if (a.t === "p") return "p" + POINTS[a.i] + (a.king ? "K" : "");
    if (a.t === "m") return "m" + POINTS[a.i] + POINTS[a.j];
    return "x" + POINTS[a.i];
  }
  function decAction(str){
    var t = str[0], b = str.slice(1);
    if (t === "p"){
      var king = b.slice(-1) === "K"; if (king) b = b.slice(0,-1);
      if (IX[b] === undefined) return null;
      return {t:"p", i:IX[b], king: king ? 1 : 0};
    }
    if (t === "m"){
      var f = b.slice(0,2), g = b.slice(2,4);
      if (IX[f] === undefined || IX[g] === undefined) return null;
      return {t:"m", i:IX[f], j:IX[g]};
    }
    if (t === "x"){ if (IX[b] === undefined) return null; return {t:"x", i:IX[b]}; }
    return null;
  }
  function sameAction(a, b){
    return a.t === b.t && a.i === b.i && (a.j === b.j || (a.j === undefined && b.j === undefined))
           && ((a.king?1:0) === (b.king?1:0));
  }
  function applyCode(str){
    str = (str || "").toUpperCase();
    var m = /(\d+)\.(\d+)\.([PMX][A-E1-5K]{2,5})/.exec(str);
    if (!m){ S.netMsg = "コードの形が違います。例 3.7.MC3A1"; return render(null); }
    var r = Number(m[1]), ply = Number(m[2]);
    var a = decAction(m[3][0].toLowerCase() + m[3].slice(1));
    if (!a){ S.netMsg = "その交点は盤にありません。"; return render(null); }
    if (r === 1 && ply === 1 && (S.round !== 1 || S.ply !== 0)){
      var keepNet = S.net, keepLink = S.link, keepCodes = S.codes, keepSrv = S.srv;
      reset(); S.net = keepNet; S.link = keepLink; S.codes = keepCodes; S.srv = keepSrv;
    }
    if (r !== S.round){ S.netMsg = "ラウンドが合いません。こちらは第" + S.round + "ラウンドです。"; return render(null); }
    if (ply !== S.ply + 1){ S.netMsg = "手数が合いません。こちらは" + (S.ply + 1) + "手目待ちです。"; return render(null); }
    var legal = legalActions(S.P);
    var ok = false;
    for (var i=0;i<legal.length;i++) if (sameAction(legal[i], a)){ a = legal[i]; ok = true; break; }
    if (!ok){ S.netMsg = "その手はこの局面で指せません。"; return render(null); }
    S.netMsg = "";
    S.srvApplying = true;
    try { doAction(a); } finally { S.srvApplying = false; }
    if (!S.net && !S.srv){                     // 初めて受け取った側は、いまの手番が自分の色
      S.net = S.P.cap ? S.P.cap : S.P.turn;
      S.cpu = 0;                                  // reset() を呼ばずに CPU を切る
      ["cpuOff","cpu2","cpu1"].forEach(function(id,k){
        document.getElementById(id).setAttribute("aria-pressed", String([0,2,1][k] === 0)); });
      ["netOff","netB","netA"].forEach(function(id,k){
        document.getElementById(id).setAttribute("aria-pressed", String([0,1,2][k] === S.net)); });
      S.netMsg = "あなたは " + NAME[S.net] + " です。";
      render(null);
    }
  }

  /* ===== リンク対戦（相手はブラウザだけあればよい） ===== */
  var LKEY = "jusanboshi.g.";
  function linkSave(){
    if (!S.link) return;
    try { localStorage.setItem(LKEY + S.link.gid,
      JSON.stringify({codes:S.codes, color:S.net})); } catch(e){}
  }
  function linkLoad(gid){
    try { return JSON.parse(localStorage.getItem(LKEY + gid) || "null"); } catch(e){ return null; }
  }
  function linkReplay(codes){
    S.linkReplaying = true;
    try { return linkReplayInner(codes); } finally { S.linkReplaying = false; }
  }
  function linkReplayInner(codes){
    for (var i=0;i<codes.length;i++){
      var before = S.ply + S.round * 1000;
      S.clkStamp = (S.clkTimes && S.clkTimes[codes[i]]) || 0;
      applyCode(codes[i]);
      if (S.end && !S.matchOver && i < codes.length - 1) nextRound();
      if (S.ply + S.round * 1000 === before) return false;   // 途中で食い違った
    }
    return true;
  }
  function linkStart(){
    var gid = Math.random().toString(36).slice(2, 8);
    S.link = {gid:gid}; S.codes = [];
    S.net = 1;                       // 始めた側が黒
    S.srv = null; S.cpu = 0;
    resetKeepLink();
    S.linkMsg = "対局を作りました。最初の手を指して、出てきたリンクを相手に送ってください。";
    linkSave(); render(null);
  }
  function resetKeepLink(){
    var keep = S.link, codes = S.codes, color = S.net;
    reset();
    S.link = keep; S.codes = codes; S.net = color;
  }
  function linkURL(){
    if (!S.link || !S.lastCode) return "";
    var base = location.href.split("#")[0];
    return base + "#g=" + S.link.gid + "&c=" + S.lastCode;
  }
  function linkIncoming(gid, code){
    var saved = linkLoad(gid);
    S.link = {gid:gid};
    S.codes = (saved && saved.codes) ? saved.codes.slice() : [];
    S.net = (saved && saved.color) ? saved.color : 0;
    S.srv = null; S.cpu = 0;
    resetKeepLink();
    if (!linkReplay(S.codes)){
      S.linkMsg = "保存していた手順と食い違いました。相手に最初からやり直してもらってください。";
      return render(null);
    }
    if (S.codes.indexOf(code) < 0){
      var before = S.ply + S.round * 1000;
      applyCode(code);
      if (S.ply + S.round * 1000 === before){
        S.linkMsg = "受け取った手を反映できませんでした。" + (S.netMsg || "");
        return render(null);
      }
      // doAction 側で S.codes に積まれ、保存もされる
    }
    if (!S.net) S.net = S.P.turn;      // 相手が指した直後なので、いまの手番が自分
    S.linkMsg = "あなたは " + NAME[S.net] + " です。";
    linkSave(); render(null);
  }

  // リンクを開いたとき（ページを開いたままリンクを踏んだ場合も含む）
  function handleHash(){
    try {
      var hash = (location.hash || "").replace(/^#/, "");
      var mg = /g=([a-z0-9]+)/i.exec(hash);
      var mc = /c=(\d+\.\d+\.[PMX][A-E1-5K]{2,5})/i.exec(hash);
      if (mg && mc) return linkIncoming(mg[1], mc[1].toUpperCase());
      if (mg){
        var sv = linkLoad(mg[1]);
        if (sv){
          S.link = {gid:mg[1]}; S.codes = sv.codes.slice(); S.net = sv.color;
          S.srv = null; S.cpu = 0;
          resetKeepLink(); linkReplay(S.codes); render(null);
        }
      }
    } catch(e){ S.linkMsg = "リンクを読み込めませんでした。"; render(null); }
  }

  /* ===== サーバー対戦 ===== */
  function api(path, opts){
    return fetch(path, opts).then(function(r){
      return r.json().then(function(j){ if (!r.ok) throw j; return j; });
    });
  }
  function srvJoin(){
    var roomEl = document.getElementById("srvRoom");
    var name = (roomEl.value || "").trim();
    if (!name){ S.srvMsg = "合言葉を入れてください。"; return render(null); }
    var want = Number(document.getElementById("srvWant").value || 0);
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem("jusanboshi.seat." + name) || "null"); } catch(e){}
    S.srvMsg = "接続しています…"; render(null);
    api("/api/join", {method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({room:name, want:want, token: saved && saved.token})})
      .then(function(j){
        try { localStorage.setItem("jusanboshi.seat." + name, JSON.stringify({token:j.token})); } catch(e){}
        S.srv = {room:name, color:j.color, token:j.token, applied:0};
        S.net = j.color; S.cpu = 0;
        reset();
        S.srv.applied = 0;
        applyIncoming(j.codes || []);
        S.srvMsg = "参加しました。あなたは " + NAME[j.color] + " です。";
        render(null);
        srvPoll();
      })
      .catch(function(e){
        S.srvMsg = (e && e.error === "room_full") ? "その合言葉の席は埋まっています。別の合言葉にしてください。"
                 : "サーバーにつながりません。server.js が動いているか確認してください。";
        render(null);
      });
  }
  function applyIncoming(codes){
    for (var i=0;i<codes.length;i++){
      var before = S.ply, r0 = S.round;
      applyCode(codes[i]);
      S.srv.applied += 1;
      if (S.ply === before && S.round === r0 && S.netMsg) break;   // 適用できずに止まった
    }
  }
  function srvPoll(){
    if (!S.srv) return;
    api("/api/sync?room=" + encodeURIComponent(S.srv.room) + "&n=" + S.srv.applied)
      .then(function(j){
        if (!S.srv) return;
        if (j.codes && j.codes.length) applyIncoming(j.codes);
        S.srvMsg = j.seats && j.seats[1] && j.seats[2] ? "" : "相手の参加を待っています。";
        render(null);
      })
      .catch(function(){ S.srvMsg = "通信が途切れました。再接続してください。"; render(null); })
      .then(function(){ if (S.srv) setTimeout(srvPoll, 1500); });
  }
  function srvSend(code){
    if (!S.srv) return;
    api("/api/move", {method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({room:S.srv.room, color:S.srv.color, token:S.srv.token, code:code})})
      .then(function(j){ if (S.srv) S.srv.applied = j.n; })
      .catch(function(){ S.srvMsg = "送信できませんでした。"; render(null); });
  }
  function srvInviteURL(){
    if (!S.srv) return "";
    return location.origin + location.pathname + "?room=" + encodeURIComponent(S.srv.room);
  }
  function srvLeave(){
    S.srv = null; S.net = 0; S.srvMsg = "切断しました。";
    ["netOff","netB","netA"].forEach(function(id,k){
      document.getElementById(id).setAttribute("aria-pressed", String(k===0));
    });
    reset();
  }

  function doAction(a){
    S.stack.push({P:clone(S.P), log:S.log.slice(), seen:Object.assign({}, S.seen),
                  lastMove:S.lastMove, capInfo:S.capInfo, pts:S.pts.slice(),
                  round:S.round, first:S.first, placeKing:S.placeKing,
                  drawStreak:S.drawStreak, drawCause:S.drawCause.slice()});
    var actor = S.P.cap ? S.P.cap : S.P.turn;
    var r = apply(S.P, a);
    if (a.t === "p"){ S.log.push({txt:POINTS[a.i] + (a.king ? "王" : ""), pl:actor}); S.lastMove = {to:POINTS[a.i]}; }
    else if (a.t === "m"){ S.log.push({txt:POINTS[a.i] + "→" + POINTS[a.j], pl:actor}); S.lastMove = {from:POINTS[a.i], to:POINTS[a.j]}; }
    else { var last = S.log[S.log.length-1]; if (last) { last.txt += " 取" + POINTS[a.i]; last.cap = true; } }
    S.P = r.P; S.pick = null; S.placeKing = false;
    S.ply += 1;
    S.lastCode = S.round + "." + S.ply + "." + encAction(a).toUpperCase();
    if (S.srv && actor === S.srv.color && !S.srvApplying) srvSend(S.lastCode);
    if (S.link && !S.linkReplaying && S.codes.indexOf(S.lastCode) < 0){ S.codes.push(S.lastCode); linkSave(); }
    if (S.auto && !S.linkReplaying && S.codes.indexOf(S.lastCode) < 0){ S.codes.push(S.lastCode); S.autoDirty = true; }
    if (S.room && !S.linkReplaying && S.codes.indexOf(S.lastCode) < 0){ S.codes.push(S.lastCode); S.roomDirty = true; }
    if (r.ev && r.ev.trigger) S.capInfo = {by:r.ev.trigger.by, at:null};
    else if (r.ev && r.ev.cap) S.capInfo = {by:r.ev.cap.by, at:POINTS[r.ev.cap.at]};
    else if (a.t !== "x") S.capInfo = null;
    S.end = r.end;
    if (!S.end && !S.P.cap){
      var k = posKey(S.P);
      S.seen[k] = (S.seen[k]||0) + 1;
      if (S.seen[k] >= 3) S.end = {scorer:0, p:0, name:"千日手", draw:true, causer:actor,
        text:"千日手（回転して同じ形も含む）。得点なしで攻守交代します", pts:[], shape:"line"};
    }
    if (S.end && S.end.matchLoss){
      S.matchOver = S.end.scorer;              // 早三星は得点と無関係にその場で負け
      S.matchNote = NAME[S.end.fouler] + "の早三星";
    } else if (S.end && S.end.draw){
      S.drawStreak += 1;
      if (S.end.causer) S.drawCause[S.end.causer] += 1;
      if (S.drawStreak >= DRAW_LIMIT){
        // 千日手を多く起こした側の負け。同数なら第1ラウンドの先攻が負け
        var loser = S.drawCause[1] > S.drawCause[2] ? 1
                  : (S.drawCause[2] > S.drawCause[1] ? 2 : 1);
        S.matchOver = loser === 1 ? 2 : 1;
        S.matchNote = "引き分け" + DRAW_LIMIT + "連続。千日手を起こした回数 黒" +
          S.drawCause[1] + "・青" + S.drawCause[2] +
          (S.drawCause[1] === S.drawCause[2] ? "（同数のため第1ラウンドの先攻 " + NAME[S.first0] + " の負け）" : "");
        S.end.matchLoss = true;
      }
    } else if (S.end && S.end.scorer){
      S.drawStreak = 0; S.drawCause = [0,0,0];
      S.pts[S.end.scorer] += S.end.p;
      if (S.pts[S.end.scorer] >= GOAL){ S.matchOver = S.end.scorer; S.matchNote = S.pts[S.end.scorer] + "点に到達"; }
    }
    render(a.t === "m" ? POINTS[a.j] : (a.t === "p" ? POINTS[a.i] : null));
    clkPush(actor, S.clkStamp, !!S.end); S.clkStamp = 0;
    if (S.end) histPush(S.P, S.end, S.pts);
    if (S.end && !S.matchOver && !S.linkReplaying) pauseStart();
    if (S.autoDirty){ S.autoDirty = false; autoPush(); }
    if (S.roomDirty){ S.roomDirty = false; roomSend({t:"move", c:S.lastCode}); }
    if (!S.end && !humanTurn()) setTimeout(cpuMove, 260);
  }

  // 次のラウンドへ（攻守交代）
  function nextRound(){
    if (S.matchOver) return;
    S.first = S.first === 1 ? 2 : 1;
    S.round += 1;
    S.P = newPos(S.first);
    S.stack = []; S.log = []; S.end = null; S.pick = null; S.seen = {};
    S.lastMove = null; S.capInfo = null; S.placeKing = false;
    S.ply = 0; S.lastCode = ""; S.netMsg = "";
    render(null);
    if (!humanTurn()) setTimeout(cpuMove, 400);
  }

  function cpuMove(){
    if (S.net || S.auto || S.room || S.gate || S.autoPending) return;   // 通信対戦では相手の手を勝手に指さない
    if (S.end || humanTurn()) return;
    var a = pickAction(S.P, S.level === 2 ? 6 : 3, S.level === 2 ? 1200 : 350);
    if (a) doAction(a);
  }

  /* ===== 盤の描画 ===== */
  var svg = document.getElementById("board"), NS = "http://www.w3.org/2000/svg";
  var M = 78, STEP = 106;
  function px(id){ return M + (Number(id[1]) - 1) * STEP; }
  function py(id){ return M + (5 - ROWS[id[0]]) * STEP; }
  function el(n, at){ var e = document.createElementNS(NS, n); for (var k in at) e.setAttribute(k, at[k]); return e; }
  var spotEls = {}, stoneL, markL, targetL, trailL, rayL, lastRing;

  function buildBoard(){
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var innerPairs = {};
    INNER_SIDES.forEach(function(s){
      innerPairs[s[0]+"-"+s[1]]=1; innerPairs[s[1]+"-"+s[0]]=1;
      innerPairs[s[1]+"-"+s[2]]=1; innerPairs[s[2]+"-"+s[1]]=1;
    });
    var g = el("g", {});
    EDGES.forEach(function(e){
      g.appendChild(el("line", {x1:px(e[0]), y1:py(e[0]), x2:px(e[1]), y2:py(e[1]),
        "class":"grid-line" + (innerPairs[e[0]+"-"+e[1]] ? " inner" : "")}));
    });
    svg.appendChild(g);
    var lab = el("g", {});
    [1,2,3,4,5].forEach(function(c){ var t=el("text",{x:M+(c-1)*STEP,y:566,"class":"coord","text-anchor":"middle"}); t.textContent=String(c); lab.appendChild(t); });
    ["A","B","C","D","E"].forEach(function(r){ var t=el("text",{x:26,y:M+(5-ROWS[r])*STEP+8,"class":"coord","text-anchor":"middle"}); t.textContent=r; lab.appendChild(t); });
    svg.appendChild(lab);
    var xg = el("g",{id:"xsqGroup"});
    XPTS.forEach(function(p){
      xg.appendChild(el("circle",{cx:px(p), cy:py(p), r:34, "class":"xmark"}));
    });
    svg.appendChild(xg);
    markL = el("g",{}); svg.appendChild(markL);
    trailL = el("g",{}); svg.appendChild(trailL);
    rayL = el("g",{}); svg.appendChild(rayL);
    stoneL = el("g",{}); svg.appendChild(stoneL);
    var hit = el("g",{});
    POINTS.forEach(function(p){
      var c = el("circle",{cx:px(p),cy:py(p),r:26,"class":"spot",tabindex:"0",role:"button","aria-label":p});
      c.addEventListener("click", function(){ tap(p); });
      c.addEventListener("keydown", function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); tap(p);} });
      spotEls[p]=c; hit.appendChild(c);
    });
    svg.appendChild(hit);
    var hints = el("g",{});
    POINTS.forEach(function(p){ hints.appendChild(el("circle",{cx:px(p),cy:py(p),r:4,"class":"hint","data-hint":p})); });
    svg.appendChild(hints);
    targetL = el("g",{}); svg.appendChild(targetL);
    lastRing = el("circle",{r:34,"class":"last-ring",opacity:0}); svg.appendChild(lastRing);
  }

  function occAt(p){ var i=IX[p]; return ((S.P.m[1]>>i)&1) ? 1 : (((S.P.m[2]>>i)&1) ? 2 : 0); }
  function destPts(p){ return destsOf(IX[p], S.P.m[1]|S.P.m[2]).map(function(j){ return POINTS[j]; }); }

  function tap(p){
    if (!humanTurn()) return;
    var i = IX[p], who = occAt(p);
    if (S.P.cap){
      if (who === (S.P.cap === 1 ? 2 : 1)) doAction({t:"x", i:i});   // 取るのは相手の駒
      return;
    }
    var me = S.P.turn;
    if (who === me){ S.pick = (S.pick === p) ? null : p; return render(null); }
    if (who !== 0){ S.pick = null; return render(null); }
    if (S.pick){
      if (destPts(S.pick).indexOf(p) >= 0) return doAction({t:"m", i:IX[S.pick], j:i});
      S.pick = null; return render(null);
    }
    if (S.P.h[me] > 0){
      var mustKing = (S.P.kh[me] === 1 && S.P.h[me] === 1);
      var asKing = (S.P.kh[me] === 1 && (S.placeKing || mustKing)) ? 1 : 0;
      doAction({t:"p", i:i, king:asKing});
    }
  }

  function undo(){
    if (!S.stack.length) return;
    var st;
    do {
      st = S.stack.pop();
      S.P = st.P; S.log = st.log; S.seen = st.seen; S.lastMove = st.lastMove; S.capInfo = st.capInfo;
      S.pts = st.pts; S.round = st.round; S.first = st.first; S.placeKing = st.placeKing;
      S.drawStreak = st.drawStreak; S.drawCause = st.drawCause;
      S.end = null; S.pick = null; S.matchOver = null; S.matchNote = "";
    } while (S.stack.length && !humanTurn());
    render(null);
  }
  // 対局そのものをやり直す
  function reset(){
    S.pts=[0,0,0]; S.round=1; S.first=1; S.first0=1; S.matchOver=null;
    S.drawStreak=0; S.drawCause=[0,0,0]; S.matchNote="";
    S.P = newPos(1); S.stack=[]; S.log=[]; S.end=null; S.pick=null; S.seen={};
    S.lastMove=null; S.capInfo=null; S.placeKing=false;
    S.ply=0; S.lastCode=""; S.netMsg="";
    clkReset(S.clkT0); histClear(); pauseClear();
    render(null); if(!humanTurn()) setTimeout(cpuMove,300);
  }

  /* ===== 描画 ===== */
  function render(justAt){
    var over = !!S.end, P = S.P;
    var picking = !over && P.cap;
    var dests = (!over && !picking && S.pick) ? destPts(S.pick) : [];
    var risks = (!over && !picking) ? drawRiskMoves() : [];
    var riskTo = risks.filter(function(r){ return r.from === S.pick; }).map(function(r){ return r.to; });
    var canPlace = !over && !picking && P.h[P.turn] > 0;
    var vic = picking ? (P.cap === 1 ? 2 : 1) : 0;

    while (stoneL.firstChild) stoneL.removeChild(stoneL.firstChild);
    while (targetL.firstChild) targetL.removeChild(targetL.firstChild);
    POINTS.forEach(function(p){
      var v = occAt(p), spot = spotEls[p], empty = v === 0, clickable;
      if (over || !humanTurn()) clickable = false;
      else if (picking) clickable = (v === vic);
      else if (empty) clickable = canPlace || dests.indexOf(p) >= 0 || !!S.pick;
      else clickable = (v === P.turn && destPts(p).length > 0);
      spot.classList.toggle("clickable", !!clickable);
      spot.style.pointerEvents = clickable ? "all" : "none";
      spot.setAttribute("aria-label", p + (empty ? " 空点" : (v===1 ? " 黒の駒" : " 青の駒")));
      spot.style.opacity = empty ? 1 : 0;
      document.querySelector('[data-hint="'+p+'"]').style.opacity = empty ? "" : "0";
      if (empty){
        if (dests.indexOf(p) >= 0)
          targetL.appendChild(el("circle",{cx:px(p),cy:py(p),r:11,
            "class":"target" + (riskTo.indexOf(p) >= 0 ? " draw" : "")}));
        return;
      }
      var cls = "stone p" + v;
      if (p === S.pick) cls += " pick";
      if (picking && v === vic) cls += " prey";
      if (p === justAt) cls += " drop";
      var gg = el("g",{"class":cls});
      gg.style.transformOrigin = px(p)+"px "+py(p)+"px";
      gg.appendChild(el("circle",{cx:px(p),cy:py(p),r:26}));
      if (P.k[v] === (1<<IX[p])) gg.appendChild(el("circle",{cx:px(p),cy:py(p),r:10,"class":"crown"}));
      stoneL.appendChild(gg);
    });

    // 選択した駒から、どの方向にどこまで届くか。塞いでいる駒には赤い輪を付ける
    while (rayL.firstChild) rayL.removeChild(rayL.firstChild);
    if (!over && !picking && S.pick){
      var pi = IX[S.pick], occ = P.m[1]|P.m[2];
      RAYS[pi].forEach(function(ray){
        var last = -1, blocker = -1, k;
        for (k=0;k<ray.length;k++){
          if ((occ>>ray[k])&1){ blocker = ray[k]; break; }
          last = ray[k];
          if (mode === "step") break;
        }
        if (mode === "step" && blocker < 0 && ray.length > 1) blocker = -1;
        if (last >= 0)
          rayL.appendChild(el("line", {x1:px(S.pick), y1:py(S.pick),
            x2:px(POINTS[last]), y2:py(POINTS[last]), "class":"ray"}));
        if (blocker >= 0)
          rayL.appendChild(el("circle", {cx:px(POINTS[blocker]), cy:py(POINTS[blocker]),
            r:31, "class":"blocker"}));
      });
      jumpDests(pi, occ).forEach(function(j){
        rayL.appendChild(el("line", {x1:px(S.pick), y1:py(S.pick),
          x2:px(POINTS[j]), y2:py(POINTS[j]), "class":"ray jump"}));
      });
    }

    while (trailL.firstChild) trailL.removeChild(trailL.firstChild);
    if (S.lastMove && S.lastMove.from)
      trailL.appendChild(el("line",{x1:px(S.lastMove.from),y1:py(S.lastMove.from),
        x2:px(S.lastMove.to),y2:py(S.lastMove.to),"class":"trail"}));

    while (markL.firstChild) markL.removeChild(markL.firstChild);
    function ring(pts, cls){
      var ord = pts.slice().sort(function(a,b){ return Math.atan2(py(a)-290,px(a)-290)-Math.atan2(py(b)-290,px(b)-290); });
      markL.appendChild(el("path",{d:ord.map(function(p,i){return (i?"L":"M")+px(p)+" "+py(p);}).join(" ")+" Z","class":"mark-line "+cls}));
    }
    if (S.capInfo && S.capInfo.at){
      var cp = S.capInfo.at;
      markL.appendChild(el("path",{d:"M"+(px(cp)-15)+" "+(py(cp)-15)+"L"+(px(cp)+15)+" "+(py(cp)+15)+
        "M"+(px(cp)+15)+" "+(py(cp)-15)+"L"+(px(cp)-15)+" "+(py(cp)+15),"class":"mark-line cap"}));
    }
    if (over && S.end.pts && S.end.pts.length){
      var cls2 = S.end.kind === "lose" ? "lose" : "win";
      if (S.end.shape === "square") ring(S.end.pts, cls2);
      else {
        var s2 = S.end.pts.slice().sort(function(a,b){ return (px(a)-px(b))||(py(a)-py(b)); });
        markL.appendChild(el("line",{x1:px(s2[0]),y1:py(s2[0]),x2:px(s2[s2.length-1]),y2:py(s2[s2.length-1]),"class":"mark-line "+cls2}));
      }
    }
    var lp = S.lastMove ? S.lastMove.to : null;
    if (lp && !over){ lastRing.setAttribute("cx",px(lp)); lastRing.setAttribute("cy",py(lp)); lastRing.setAttribute("opacity",1); }
    else lastRing.setAttribute("opacity",0);

    var xg2 = document.getElementById("xsqGroup");
    if (xg2){
      xg2.style.display = RULES.chuShiho ? "" : "none";
      var lit = !over && !!S.capInfo;
      Array.prototype.forEach.call(xg2.childNodes, function(n){ n.setAttribute("class", "xmark" + (lit ? " on" : "")); });
    }
    // 早三星が生きている間だけ、内側の辺を赤で示す
    svg.classList.toggle("foul-live",
      !over && RULES.hayaSanzei && (P.h[1] > 0 || P.h[2] > 0 || canPlace));

    var al = document.getElementById("alert"), alt = document.getElementById("alertText");
    var lines = [];
    if (!over && !S.matchOver){
      var rep = seenCount();
      if (S.drawStreak > 0)
        lines.push("引き分け " + S.drawStreak + " / " + DRAW_LIMIT +
                   "（千日手を起こした回数　黒 " + S.drawCause[1] + "・青 " + S.drawCause[2] + "）");
      if (rep >= 2) lines.push("いまの形はすでに " + rep + " 回目です。もう一度現れると千日手になります。");
      if (risks.length) lines.push("この手番で千日手になる指し手が " + risks.length +
                                   " 通りあります。駒を選ぶと紫の点で示します。");
      if (S.drawStreak >= DRAW_LIMIT - 2)
        lines.push("あと " + (DRAW_LIMIT - S.drawStreak) + " 回の引き分けで打切です。いまの集計なら " +
                   NAME[cutoffLoser()] + " の負けになります。");
    }
    al.style.display = lines.length ? "" : "none";
    al.className = "card alertbar" + (S.drawStreak >= DRAW_LIMIT - 2 ? " hot" : "");
    alt.innerHTML = "";
    lines.forEach(function(t){ var d=document.createElement("div"); d.textContent = t; alt.appendChild(d); });

    var warn = document.getElementById("warn");
    if (over){ warn.className="card warnbar"; warn.textContent="対局終了。"; }
    else if (!RULES.hayaSanzei){ warn.className="card warnbar";
      warn.textContent="早三星は無効です。内側の辺（破線）はいつ揃えても得点になります。"; }
    else if (P.h[1] || P.h[2]){ warn.className="card warnbar live";
      warn.textContent="盤外に駒が残っています。駒を置いて内側の辺（破線）を揃えると早三星で、得点に関係なく負けです。最後の1つを置く手も対象です。"; }
    else { warn.className="card warnbar";
      warn.textContent="8個すべてが盤上に出ました。ここから先は、駒を動かして内側の辺（破線）を揃えると内三星として得点になります。"; }

    var box=document.getElementById("turn"), sw=document.getElementById("turnSwatch");
    var who=document.getElementById("turnWho"), note=document.getElementById("turnNote");
    box.classList.remove("win","lose","cap");
    if (S.matchOver){
      var foul = S.end && S.end.matchLoss;
      box.classList.add(foul ? "lose" : "win");
      who.textContent = (foul && S.end.fouler)
        ? NAME[S.end.fouler] + "の反則負け"
        : NAME[S.matchOver] + "の勝ち";
      note.textContent = S.matchNote || (S.end ? S.end.text : "");
      sw.className = "swatch s" + S.matchOver;
    } else if (over){
      if (!S.end.scorer){ who.textContent = "得点なし"; sw.className="swatch s1"; }
      else {
        box.classList.add(S.end.foul ? "lose" : "win");
        who.textContent = NAME[S.end.scorer] + "が " + S.end.p + "点";
        sw.className = "swatch s" + S.end.scorer;
      }
      note.textContent = S.end.text;
    } else if (picking){
      box.classList.add("cap");
      who.textContent = NAME[P.cap] + "が没収します";
      note.textContent = humanTurn() ? "取る相手の駒をタップしてください。王を取れば王奪で1点" : "相手が選んでいます…";
      sw.className = "swatch s" + P.cap;
    } else {
      who.textContent = NAME[P.turn] + "の番" +
        (humanTurn() ? "" : (S.net ? "（相手の手を待っています）" : "（考え中…）"));
      note.textContent = S.pick ? "金の点へ動かします（もう一度押すと選び直し）"
                                : (canPlace ? "空点をタップで置く／自分の駒をタップで動かす" : "動かす自分の駒をタップします");
      sw.className = "swatch s" + P.turn;
    }

    [1,2].forEach(function(pl){
      var pips=document.getElementById("pips"+pl); pips.innerHTML="";
      for (var i=0;i<4;i++){
        var d=document.createElement("span");
        d.className="pip a"+pl+(i<P.h[pl]?"":" used");
        if (P.kh[pl] === 1 && i === P.h[pl]-1) d.className += " kingpip";
        pips.appendChild(d);
      }
      var lost = 4 - tot(P, pl);
      var cnt=document.getElementById("count"+pl);
      cnt.textContent = P.h[pl] + (lost ? "　-" + lost : "");
      cnt.classList.toggle("danger", lost>0);
      document.getElementById("hand"+pl).classList.toggle("active", !over && !picking && P.turn===pl);
      document.getElementById("score"+pl).textContent = S.pts[pl];
      document.getElementById("bar"+pl).style.width = Math.min(100, S.pts[pl]/GOAL*100) + "%";
    });
    document.getElementById("roundNo").textContent =
      "第" + S.round + "ラウンド　先攻 " + NAME[S.first] +
      (S.drawStreak ? "　引分" + S.drawStreak + "/" + DRAW_LIMIT : "");

    // 王を置くトグル
    var kb = document.getElementById("kingBtn"), cur = P.turn;
    var canChoose = !over && !picking && P.kh[cur] === 1 && P.h[cur] > 1 && humanTurn();
    var forced = !over && !picking && P.kh[cur] === 1 && P.h[cur] === 1;
    kb.style.display = (!over && !picking && P.kh[cur] === 1) ? "" : "none";
    kb.disabled = !canChoose;
    kb.setAttribute("aria-pressed", String(forced || S.placeKing));
    kb.textContent = forced ? "王しか置けません" : "次に王を置く";
    kb.title = S.placeKing ? "次に置く駒が王になります" : "押すと、次に置く駒が王になります";

    // 合言葉対戦
    var rc = document.getElementById("roomcard");
    rc.style.display = S.room ? "" : "none";
    if (S.room){
      document.getElementById("roomState").textContent =
        S.watch ? "席が2つとも埋まっています。観戦中です"
        : !S.net ? "相手を待っています。同じ合言葉を入れてもらってください"
        : S.matchOver ? "対局終了"
        : over ? "得点が入りました。まもなく次のラウンドへ進みます"
        : humanTurn() ? "あなた（" + NAME[S.net] + "）の番です"
          + (R.seats.length < 2 ? "。相手はまだ来ていません" : "")
        : "相手（" + NAME[3 - S.net] + "）の手を待っています";
      document.getElementById("roomWord").textContent = R.word || "—";
      var rm = document.getElementById("roomMsg");
      rm.textContent = S.roomMsg || "";
      rm.style.display = S.roomMsg ? "" : "none";
    }

    // オンライン対戦（自動同期）
    var ac = document.getElementById("autocard");
    ac.style.display = (S.auto || S.autoPending || S.autoOff) ? "" : "none";
    if (ac.style.display === ""){
      document.getElementById("autoState").textContent =
        S.autoPending ? "つないでいます…"
        : S.autoOff ? "この画面では自動同期が使えません。下のリンク対戦をお使いください"
        : S.watch ? "席が2つとも埋まっています。観戦中です"
        : S.matchOver ? "対局終了"
        : S.autoBusy ? "手を送っています…"
        : over ? "得点が入りました。まもなく次のラウンドへ進みます"
        : humanTurn() ? "あなた（" + NAME[S.net] + "）の番です"
        : "相手（" + NAME[3 - S.net] + "）の手を待っています";
      document.getElementById("autoShareBox").style.display =
        (S.auto && !S.watch && !S.autoRO) ? "" : "none";
      document.getElementById("autoCtl").style.display = S.auto ? "" : "none";
      var am = document.getElementById("autoMsg");
      am.textContent = S.autoMsg || "";
      am.style.display = S.autoMsg ? "" : "none";
    }

    // リンク対戦
    var lc = document.getElementById("linkcard");
    var canLink = location.protocol === "http:" || location.protocol === "https:";
    lc.style.display = "none";
    if (lc.style.display === ""){
      document.getElementById("linkStartBox").style.display = S.link ? "none" : "";
      document.getElementById("linkLiveBox").style.display = (S.link && linkURL()) ? "" : "none";
      if (S.link && linkURL()) document.getElementById("linkURL").textContent = linkURL();
      var lm = document.getElementById("linkMsg");
      var txt = S.linkMsg || (S.link && !linkURL() && !humanTurn() ? "相手のリンクを待っています。" : "");
      lm.textContent = txt; lm.style.display = txt ? "" : "none";
    }

    // サーバー対戦
    var sc = document.getElementById("srvcard");
    var online = location.protocol === "http:" || location.protocol === "https:";
    sc.style.display = "none";
    if (online){
      document.getElementById("srvJoinBox").style.display = S.srv ? "none" : "";
      document.getElementById("srvLiveBox").style.display = S.srv ? "" : "none";
      if (S.srv){
        document.getElementById("srvInfo").textContent =
          "合言葉「" + S.srv.room + "」　あなたは " + NAME[S.srv.color];
        document.getElementById("srvLink").textContent = srvInviteURL();
      }
      var sm = document.getElementById("srvMsg");
      sm.textContent = S.srvMsg || "";
      sm.style.display = S.srvMsg ? "" : "none";
    }

    // 通信対戦（コード交換）

  /* ===================================================================
     チェスクロック
     持ち時間は対局全体で1本。手を終えるたびに加算秒が戻ります。
     通信対戦では、中継が付けた時刻から両者が同じ値を出します。
     =================================================================== */
  var CLK = {
    on:false, base:600, inc:5,          // 秒
    stamps:[],                          // {t:秒, by:1|2} 指し終えた時刻
    t0:0,                               // 対局開始の時刻（秒）
    used:[0,0,0], tick:null, over:0
  };

  function clkNow(){ return Date.now() / 1000; }

  function clkSettings(){ return CLK ? {on: !!CLK.on, base: CLK.base, inc: CLK.inc}
                                    : {on:false, base:600, inc:5}; }
  function clkAdopt(c){
    if (!c || !CLK) return;
    CLK.on = !!c.on;
    if (typeof c.base === "number") CLK.base = c.base;
    if (typeof c.inc === "number") CLK.inc = c.inc;
    clkSyncUI();
  }

  // 対局の頭から数え直す
  function clkReset(t0){
    if (!CLK) return;
    CLK.stamps = [];
    CLK.t0 = t0 || clkNow();
    CLK.used = [0,0,0];
    CLK.over = 0;
  }

  // 手を1つ終えた。ends はその手でラウンドが終わったかどうか
  function clkPush(color, t, ends){
    if (!CLK || !CLK.on) return;
    CLK.stamps.push({t: (t ? t : clkNow()), by: color, e: !!ends});
    clkRecalc();
  }

  var PAUSE_ALLOW = 3;          // ラウンドの切れ目の待ち時間は数えない
  function clkRecalc(){
    CLK.used = [0,0,0];
    var prev = CLK.t0, wasEnd = false, i;
    for (i = 0; i < CLK.stamps.length; i++){
      var s = CLK.stamps[i];
      var d = s.t - prev;
      if (wasEnd) d -= PAUSE_ALLOW;
      if (d < 0) d = 0;
      if (s.by) CLK.used[s.by] += d - CLK.inc;   // 加算はここで戻す
      prev = s.t; wasEnd = !!s.e;
    }
  }

  // いま盤上で時計が進んでいる側
  function clkRunner(){
    if (!CLK || !CLK.on || S.gate || S.end || S.matchOver || CLK.over) return 0;
    if (S.watch || S.clkWait) return 0;      // 相手が卓に着くまで動かさない
    return S.P.cap ? S.P.cap : S.P.turn;
  }

  function clkLeft(c){
    if (!CLK || !CLK.on) return 0;
    if (!CLK.on) return CLK.base;
    var used = CLK.used[c] || 0;
    if (clkRunner() === c){
      var n = CLK.stamps.length;
      var last = n ? CLK.stamps[n-1].t : CLK.t0;
      var d = clkNow() - last;
      if (n && CLK.stamps[n-1].e) d -= PAUSE_ALLOW;
      if (d > 0) used += d;
    }
    var left = CLK.base - used;
    return left > 0 ? left : 0;
  }

  function clkFmt(sec){
    sec = Math.max(0, Math.ceil(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function clkPaint(){
    if (!CLK) return;
    var box = document.getElementById("clockRow");
    if (!box) return;
    box.style.display = CLK.on ? "" : "none";
    if (!CLK.on) return;
    var run = clkRunner();
    [1,2].forEach(function(c){
      var el = document.getElementById("clk" + c);
      var bx = document.getElementById("clkbox" + c);
      var left = clkLeft(c);
      el.textContent = clkFmt(left);
      bx.classList.toggle("run", run === c);
      bx.classList.toggle("low", left <= 30);
      bx.classList.toggle("out", left <= 0);
    });
    // 時間切れ
    if (!CLK.over && !S.matchOver){
      var loser = clkLeft(1) <= 0 ? 1 : (clkLeft(2) <= 0 ? 2 : 0);
      if (loser){
        CLK.over = loser;
        S.matchOver = loser === 1 ? 2 : 1;
        S.matchNote = NAME[loser] + "の時間切れ";
        S.end = {scorer: S.matchOver, p:0, name:"時間切れ", matchLoss:true,
                 text: NAME[loser] + "の持ち時間がなくなりました", pts:[], shape:"line"};
        render(null);
      }
    }
  }

  function clkStart(){
    if (CLK.tick) return;
    CLK.tick = setInterval(clkPaint, 250);
  }

  function clkSyncUI(){
    if (!CLK) return;
    var on = document.getElementById("clkOn");
    if (!on) return;
    on.setAttribute("aria-pressed", String(!!CLK.on));
    on.textContent = CLK.on ? "持ち時間あり" : "持ち時間なし";
    document.getElementById("clkBase").value = String(CLK.base);
    document.getElementById("clkInc").value = String(CLK.inc);
    var gon = document.getElementById("gClkOn");
    if (gon){
      gon.setAttribute("aria-pressed", String(!!CLK.on));
      gon.textContent = CLK.on ? "持ち時間あり" : "持ち時間なし";
      document.getElementById("gClkBase").value = String(CLK.base);
      document.getElementById("gClkInc").value = String(CLK.inc);
    }
    var why = document.getElementById("clkWhy");
    why.textContent = CLK.on
      ? ("ひとり " + Math.round(CLK.base/60) + "分。手を終えるたびに " + CLK.inc +
         "秒 戻ります。使い切った側がその場で負けです。相手が卓に着くまで時計は動きません。")
      : "持ち時間を使わない設定です。";
    clkPaint();
  }

  function clkSave(){
    try { localStorage.setItem("jusanboshi.clock", JSON.stringify(clkSettings())); } catch(e){}
  }
  function clkLoad(){
    try {
      var o = JSON.parse(localStorage.getItem("jusanboshi.clock") || "null");
      if (o) clkAdopt(o);
    } catch(e){}
  }

  /* ===== オンライン対戦（アーティファクトの自己再発行で同期） ===== */
  var AUTO = null, AST = {codes:[], seats:{}, v:0}, ME = "";
  (function(){
    try { ME = localStorage.getItem("jusanboshi.me") || ""; } catch(e){}
    if (!ME){
      ME = Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem("jusanboshi.me", ME); } catch(e){}
    }
  })();

  function autoRead(){
    try {
      var el = document.getElementById("jbstate");
      var o = el ? JSON.parse(el.textContent || "{}") : {};
      return {codes: o.codes || [], seats: o.seats || {}, rules: o.rules || null, v: o.v || 0};
    } catch(e){ return {codes:[], seats:{}, rules:null, v:0}; }
  }

  // 役の設定は両者で同じでなければ手順の再生がずれる。状態に載せて共有する
  function autoRules(){
    var o = {mode: RULES.mode};
    for (var k in PRESET) if (k !== "mode") o[k] = !!RULES[k];
    return o;
  }
  function autoAdopt(r){
    if (!r) return;
    for (var k in PRESET) if (k !== "mode" && (k in r)) RULES[k] = !!r[k];
    if (r.mode) RULES.mode = r.mode;
    applyRules(); syncToggles(); setMode(RULES.mode);
  }

  // 席の決め方。自分の印がある席が自分の色。空いていれば黒、次に青、両方埋まっていれば観戦
  function autoSeat(){
    var s = AST.seats || {};
    if (s["1"] === ME) return 1;
    if (s["2"] === ME) return 2;
    if (!s["1"]) return 1;
    if (!s["2"]) return 2;
    return 0;
  }

  function autoDoc(st){
    var W = window.__JB || {};
    return W.head
      + '<script id="jbstate" type="application/json">'
      + JSON.stringify(st).replace(/</g, "\\u003c")
      + '<' + '/script>\n<script id="jbapp">' + W.self + '<' + '/script>'
      + W.tail;
  }

  function autoPush(){
    if (!S.auto || !AUTO || S.autoBusy || S.autoRO) return;
    var s = AST.seats || {}, st = {codes: S.codes.slice(), seats: {},
                                   rules: autoRules(), v: (AST.v || 0) + 1};
    if (s["1"]) st.seats["1"] = s["1"];
    if (s["2"]) st.seats["2"] = s["2"];
    if (S.net === 1 || S.net === 2) st.seats[String(S.net)] = ME;
    S.autoBusy = true; S.autoMsg = ""; render(null);
    AUTO.publish(autoDoc(st)).then(function(){
      // 成功すると、開いているすべての画面がこの版に切り替わります
      S.autoMsg = "相手の画面にも届きました。";
      render(null);
    }, function(e){
      S.autoBusy = false;
      var c = String((e && (e.code || e.message)) || e || "");
      if (/conflict/i.test(c)){
        S.autoMsg = "相手が先に指していました。画面が最新に切り替わります。";
      } else if (/not_writer|not_granted|permission|forbidden|readonly/i.test(c)){
        S.autoRO = true;
        S.autoMsg = "この画面には書き込みの権限がないので、手を自動で送れません。下に出たコードを相手に送ってください。相手が「反映」すると先に進みます。";
      } else {
        S.autoMsg = "送れませんでした（" + c + "）。もう一度指してみてください。";
      }
      render(null);
    });
  }

  function autoLoad(){
    var codes = (AST.codes || []).slice();
    var seat = autoSeat();
    autoAdopt(AST.rules);
    reset();
    S.auto = true; S.cpu = 0; S.srv = null; S.link = null;
    S.net = seat; S.watch = (seat === 0);
    S.codes = codes;
    if (codes.length) linkReplay(codes);
    render(null);
  }

  // この画面が claude.ai のアーティファクトなら、そこを卓として使えます
  function artDetect(){
    if (!(window.claude && typeof window.claude.use === "function")) return;
    AST = autoRead();
    window.claude.use("artifact").then(function(ns){
      if (!ns) return;
      AUTO = ns; S.artReady = true;
      document.getElementById("gArtSec").style.display = "";
      document.getElementById("gRoomSec").style.display = "none";
      if (entryGet() === "artifact" && S.gate){ gateHide(); startArtifact(); }
      render(null);
    }, function(){});
  }

  function startArtifact(){
    if (!AUTO) return gateShow("この画面ではまだ準備ができていません。少し待ってからもう一度押してください。");
    roomClose();
    AST = autoRead();
    autoLoad();
    S.auto = true; S.autoPending = false;
    render(null);
  }

  // 役の設定を変えたら、両者の対局を新しい設定で始め直す
  function autoPushRules(){
    if (!S.auto || !AUTO || S.autoBusy) return;
    var s = AST.seats || {}, st = {codes: [], seats: {}, rules: autoRules(), v: (AST.v || 0) + 1};
    if (s["1"]) st.seats["1"] = s["1"];
    if (s["2"]) st.seats["2"] = s["2"];
    S.autoBusy = true; S.autoMsg = "設定を相手にも反映しています…"; render(null);
    AUTO.publish(autoDoc(st)).then(function(){}, function(){
      S.autoBusy = false; S.autoMsg = "設定を送れませんでした。"; render(null);
    });
  }

  function autoReset(){
    if (!AUTO) return;
    S.autoBusy = true; S.autoMsg = "やり直しています…"; render(null);
    AUTO.publish(autoDoc({codes: [], seats: {}, rules: autoRules(), v: (AST.v || 0) + 1})).then(function(){
      S.autoMsg = "";
    }, function(){
      S.autoBusy = false; S.autoMsg = "やり直せませんでした。"; render(null);
    });
  }

  /* ===================================================================
     最初の画面（卓を選ぶ）と、合言葉でつながる通信
     =================================================================== */

  var ME = "";
  (function(){
    try { ME = localStorage.getItem("jusanboshi.me") || ""; } catch(e){}
    if (!ME){
      ME = Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem("jusanboshi.me", ME); } catch(e){}
    }
  })();

  /* ---- 役の設定を相手と揃える ---- */
  function rulesNow(){
    var o = {mode: RULES.mode}, k;
    for (k in PRESET) if (k !== "mode") o[k] = !!RULES[k];
    o.clock = clkSettings();
    return o;
  }
  function rulesAdopt(r){
    if (!r) return;
    for (var k in PRESET) if (k !== "mode" && (k in r)) RULES[k] = !!r[k];
    if (r.mode) RULES.mode = r.mode;
    if (r.clock) clkAdopt(r.clock);
    applyRules(); syncToggles(); setMode(RULES.mode);
  }

  /* ---- 合言葉から卓の名前を作る。合言葉そのものは外に出さない ---- */
  function topicOf(word){
    var a = 5381, b = 52711, i;
    for (i = 0; i < word.length; i++){
      a = ((a * 33) ^ word.charCodeAt(i)) >>> 0;
      b = ((b * 131) ^ word.charCodeAt(word.length - 1 - i)) >>> 0;
    }
    return "jusanboshi-" + ("0000000" + a.toString(36)).slice(-7)
                         + ("0000000" + b.toString(36)).slice(-7);
  }

  /* ===== 中継（ntfy.sh。登録もアカウントも要りません） ===== */
  var RELAY = (window.__RELAY__ || "https://ntfy.sh/");
  var R = { word:"", topic:"", log:[], seen:{}, es:null, timer:null, seats:[] };

  function roomParse(text){
    try {
      var o = JSON.parse(text);
      return (o && o.v === 1 && o.t) ? o : null;
    } catch(e){ return null; }
  }

  // 受け取った丸ごとの記録から、いまの局面を組み立て直す
  function roomRebuild(){
    var keepKing = S.placeKing;          // 王を置く指定は消さない
    var msgs = R.log, start = 0, i;
    for (i = msgs.length - 1; i >= 0; i--) if (msgs[i].t === "new"){ start = i; break; }
    var seq = msgs.slice(start);

    var seats = [], codes = [], rules = null, times = {}, t0 = 0, oks = {};
    // 席は記録の全体で決める。仕切り直しても色は変わらない
    var tPair = 0;
    for (i = 0; i < msgs.length; i++){
      var q = msgs[i];
      if ((q.t === "join" || q.t === "move") && q.by && seats.indexOf(q.by) < 0 && seats.length < 2){
        seats.push(q.by);
        if (seats.length === 2) tPair = q.__t || 0;      // 2人目が着いた時刻
      }
    }
    // 手と設定は、いちばん新しい仕切り直しから先だけ
    for (i = 0; i < seq.length; i++){
      var m = seq[i];
      if (!t0 && m.__t) t0 = m.__t;
      if (m.t === "new" && m.rules) rules = m.rules;
      if (m.t === "move" && m.c && codes.indexOf(m.c) < 0){ codes.push(m.c); times[m.c] = m.__t || 0; }
      if (m.t === "ok" && m.by){ (oks[m.r] = oks[m.r] || {})[m.by] = 1; }
    }
    R.seats = seats;
    S.clkTimes = times;
    S.clkT0 = Math.max(t0 || 0, tPair || 0);
    S.clkWait = (seats.length < 2);

    var seat = seats.indexOf(ME);
    var me = seat === 0 ? 1 : (seat === 1 ? 2 : 0);

    rulesAdopt(rules);
    reset();
    S.room = true; S.cpu = 0; S.srv = null; S.link = null; S.auto = false;
    S.net = me; S.watch = (me === 0 && seats.length >= 2);
    S.codes = codes.slice();
    if (codes.length && !linkReplay(codes))
      S.roomMsg = "相手と手順が食い違いました。「新しい対局」を押してやり直してください。";
    S.placeKing = keepKing && S.P.kh[S.P.turn] === 1;
    // まだ何も決まっていない部屋なら、最初に着いた人の設定を貼っておく
    if (!rules && !codes.length && seats.length && seats[0] === ME && !R.pinned){
      R.pinned = true;
      roomSend({t:"new", rules: rulesNow()});
    }
    if (S.end && !S.matchOver){
      pauseStart();
      if (S.pause && oks[S.round]) S.pause.acks = oks[S.round];
      pauseCheck();
    }
    render(null);
  }

  var rebuildWait = null;
  function roomTouch(){
    if (rebuildWait) clearTimeout(rebuildWait);
    rebuildWait = setTimeout(function(){ rebuildWait = null; roomRebuild(); }, 90);
  }

  function roomTake(text, at){
    var m = roomParse(text);
    if (!m) return;
    if (at) m.__t = at;
    // 同じものを二度積まない
    var key = m.t + "|" + (m.by || "") + "|" + (m.c || "") + "|" + (m.n || "");
    if (R.seen[key]) return;
    R.seen[key] = 1;
    R.log.push(m);
    roomTouch();
  }

  function roomSend(msg){
    msg.v = 1; msg.by = ME;
    if (!msg.n) msg.n = Math.random().toString(36).slice(2, 8);
    S.roomBusy = true; render(null);
    return fetch(RELAY + R.topic, {method:"POST", body: JSON.stringify(msg)})
      .then(function(res){
        S.roomBusy = false;
        if (!res.ok) throw new Error("HTTP " + res.status);
        S.roomErr = false; S.roomMsg = "";
        // 席と仕切り直しの順番は中継が返す順で決める。手だけ先に映す
        if (msg.t === "move") roomTake(JSON.stringify(msg));
        render(null);
      }, function(e){
        S.roomBusy = false; S.roomErr = true;
        S.roomMsg = "手を送れませんでした。下のコードを相手に渡してください。";
        render(null);
      });
  }

  function roomOpen(word){
    roomClose();
    R.word = word; R.topic = topicOf(word); R.log = []; R.seen = {}; R.seats = []; R.pinned = false;
    S.room = true; S.roomErr = false; S.roomMsg = "つないでいます…"; S.cpu = 0;
    try { localStorage.setItem("jusanboshi.word", word); } catch(e){}
    render(null);

    var url = RELAY + R.topic + "/sse?since=all";
    var ok = false;
    try {
      R.es = new EventSource(url);
      R.es.addEventListener("message", function(ev){
        ok = true; S.roomMsg = "";
        try {
          var d = JSON.parse(ev.data);
          if (d && d.event === "message" && d.message) roomTake(d.message, d.time);
        } catch(e){}
      });
      R.es.addEventListener("open", function(){ ok = true; S.roomMsg = ""; render(null); });
      R.es.addEventListener("error", function(){
        if (!ok) roomPollFallback();
      });
    } catch(e){ roomPollFallback(); }

    // つながらないときのために、少し待って様子を見る
    setTimeout(function(){ if (!ok && S.room) roomPollFallback(); }, 4000);

    roomSend({t:"join"});
  }

  function roomPollFallback(){
    if (R.es){ try { R.es.close(); } catch(e){} R.es = null; }
    if (R.timer) return;
    var tick = function(){
      if (!S.room){ R.timer = null; return; }
      fetch(RELAY + R.topic + "/json?poll=1&since=all")
        .then(function(r){ return r.text(); })
        .then(function(t){
          S.roomMsg = ""; S.roomErr = false;
          t.split("\n").forEach(function(line){
            if (!line) return;
            try { var d = JSON.parse(line);
                  if (d && d.event === "message" && d.message) roomTake(d.message, d.time); } catch(e){}
          });
          render(null);
        }, function(){
          S.roomErr = true;
          S.roomMsg = "中継につながりません。下のコードを送り合う形でも遊べます。";
          render(null);
        });
      R.timer = setTimeout(tick, 6000);
    };
    R.timer = setTimeout(tick, 200);
    tick();
  }

  function roomClose(){
    if (R.es){ try { R.es.close(); } catch(e){} R.es = null; }
    if (R.timer){ clearTimeout(R.timer); R.timer = null; }
    S.room = false; S.roomBusy = false;
  }

  function roomNew(){
    if (!S.room) return;
    R.log = []; R.seen = {};
    roomSend({t:"new", rules: rulesNow()});
  }

  /* ===== 最初の画面 ===== */
  function gateShow(msg){
    S.gate = true;
    roomClose();
    document.getElementById("gate").style.display = "";
    document.body.classList.add("gated");
    var g = document.getElementById("gMsg");
    g.textContent = msg || "";
    g.style.display = msg ? "" : "none";
    try {
      var w = localStorage.getItem("jusanboshi.word") || "";
      if (w && !document.getElementById("gWord").value)
        document.getElementById("gWord").value = w;
    } catch(e){}
    render(null);
  }
  function gateHide(){
    S.gate = false;
    document.getElementById("gate").style.display = "none";
    document.body.classList.remove("gated");
  }

  function startCpu(level){
    gateHide();
    roomClose();
    S.net = 0; S.watch = false; S.auto = false; S.room = false;
    S.cpu = level === 0 ? 0 : 2;      // 2 = 後手をCPUが持つ
    S.level = level === 1 ? 1 : 2;    // 1 = やさしい / 2 = 強い
    saveSettings();
    ["cpuOff","cpu2","cpu1"].forEach(function(id,k){
      document.getElementById(id).setAttribute("aria-pressed", String([0,2,1][k] === S.cpu));
    });
    document.getElementById("lv1").setAttribute("aria-pressed", String(S.level === 1));
    document.getElementById("lv2").setAttribute("aria-pressed", String(S.level === 2));
    reset();
  }

  function startRoom(){
    var w = (document.getElementById("gWord").value || "").trim();
    if (w.length < 2){
      return gateShow("合言葉は2文字以上にしてください。相手と同じものを入れます。");
    }
    if (!(window.fetch && window.EventSource || window.fetch)){
      return gateShow("この環境では通信対戦を使えません。ひとりで指す方をお選びください。");
    }
    gateHide();
    roomOpen(w);
  }

  var WORDS_A = ["あお","あか","しろ","くろ","みどり","きん","ぎん","むらさき","そら","つき"];
  var WORDS_B = ["さくら","つばめ","かもめ","うさぎ","きつね","たぬき","くじら","とんぼ","こま","ほし"];
  function makeWord(){
    var a = WORDS_A[Math.floor(Math.random()*WORDS_A.length)];
    var b = WORDS_B[Math.floor(Math.random()*WORDS_B.length)];
    return a + b + (10 + Math.floor(Math.random()*90));
  }

  /* ===== どの入口から入ったかを覚えておく ===== */
  var EKEY = "jusanboshi.entry";
  function entrySet(v){ try { localStorage.setItem(EKEY, v || ""); } catch(e){} }
  function entryGet(){ try { return localStorage.getItem(EKEY) || ""; } catch(e){ return ""; } }

  function bootEntry(){
    artDetect();                       // 使える環境なら、あとから選択肢が増えます
    var e = entryGet();
    if (e === "room"){
      var w = "";
      try { w = localStorage.getItem("jusanboshi.word") || ""; } catch(x){}
      if (w){
        document.getElementById("gWord").value = w;
        gateHide(); roomOpen(w); return;
      }
    }
    if (e === "cpu1"){ gateHide(); startCpu(1); return; }
    if (e === "cpu2"){ gateHide(); startCpu(2); return; }
    if (e === "duo"){  gateHide(); startCpu(0); return; }
    if (e === "artifact"){ gateShow(""); return; }   // artDetect が解決したら自動で入ります
    gateShow("");
  }

  /* ===================================================================
     ラウンドの記録と見返し、そして「了解」で次へ進む仕組み
     =================================================================== */
  var HIST = [];

  function histClear(){ HIST = []; histPaint(); }

  function histPush(P, end, pts){
    if (!HIST) HIST = [];
    if (HIST.length && HIST[HIST.length-1].r === S.round) return;   // 二重に積まない
    HIST.push({
      r: S.round, first: S.first,
      m1: P.m[1], m2: P.m[2], k1: P.k[1], k2: P.k[2],
      sc: end.scorer || 0, p: end.p || 0,
      nm: end.name || "", tx: end.text || "",
      pts: pts.slice(),
      hi: (end.pts || []).slice(),
      mv: S.log.map(function(x){ return {t: x.txt, pl: x.pl, cap: !!x.cap}; }),
      draw: !!end.draw, foul: !!end.foul, over: !!end.matchLoss
    });
    histPaint();
  }

  // 記録用の小さな盤
  function histSvg(rec){
    var o = ['<svg viewBox="26 26 528 528" class="minib" aria-hidden="true">'], i, j;
    for (i = 0; i < EDGES.length; i++){
      var a = EDGES[i][0], b = EDGES[i][1];
      var inner = isInnerSide([a, b, a]) ? false : false;
      o.push('<line x1="' + px(a) + '" y1="' + py(a) + '" x2="' + px(b) + '" y2="' + py(b) +
             '" class="ml"/>');
    }
    for (i = 0; i < POINTS.length; i++){
      var p = POINTS[i], k = IX[p];
      var v = ((rec.m1 >> k) & 1) ? 1 : (((rec.m2 >> k) & 1) ? 2 : 0);
      if (!v){ o.push('<circle cx="' + px(p) + '" cy="' + py(p) + '" r="9" class="mp"/>'); continue; }
      o.push('<circle cx="' + px(p) + '" cy="' + py(p) + '" r="34" class="s' + v + '"/>');
      var km = v === 1 ? rec.k1 : rec.k2;
      if ((km >> k) & 1)
        o.push('<circle cx="' + px(p) + '" cy="' + py(p) + '" r="15" class="kk' + v + '"/>');
    }
    for (i = 0; i < (rec.hi || []).length; i++){
      var h = rec.hi[i];
      if (IX[h] === undefined) continue;
      o.push('<circle cx="' + px(h) + '" cy="' + py(h) + '" r="45" class="hl"/>');
    }
    o.push('</svg>');
    return o.join("");
  }

  function histTitle(rec){
    if (rec.draw) return "千日手・得点なし";
    if (!rec.sc) return "得点なし";
    return NAME[rec.sc] + "　" + (rec.nm || "") + "　" + rec.p + "点";
  }

  function histPaint(){
    var card = document.getElementById("histcard");
    if (!card) return;
    card.style.display = (HIST && HIST.length) ? "" : "none";
    var ol = document.getElementById("histList");
    if (!ol) return;
    ol.innerHTML = "";
    for (var i = HIST.length - 1; i >= 0; i--){
      (function(rec, idx){
        var li = document.createElement("li");
        li.className = "hitem";
        var head = document.createElement("button");
        head.type = "button"; head.className = "hhead";
        head.setAttribute("aria-expanded", "false");
        head.innerHTML = '<span class="hr">第' + rec.r + 'ラウンド</span>' +
                         '<span class="hs' + (rec.sc || 0) + '">' + histTitle(rec) + '</span>' +
                         '<span class="hp">' + rec.pts[1] + " − " + rec.pts[2] + '</span>';
        var body = document.createElement("div");
        body.className = "hbody"; body.style.display = "none";
        head.addEventListener("click", function(){
          var open = body.style.display !== "none";
          body.style.display = open ? "none" : "";
          head.setAttribute("aria-expanded", String(!open));
          if (!open && !body.dataset.built){
            body.dataset.built = "1";
            body.innerHTML = histSvg(rec) +
              '<p class="htx">' + (rec.tx || "") + '</p>' +
              '<ol class="hmv">' + rec.mv.map(function(m, n){
                return '<li class="d' + m.pl + (m.cap ? " cap" : "") + '">' +
                       (n+1) + ". " + m.t + '</li>'; }).join("") + '</ol>';
          }
        });
        li.appendChild(head); li.appendChild(body);
        ol.appendChild(li);
      })(HIST[i], i);
    }
  }

  /* ===== 次のラウンドへ進むまで =====
     ふたりで指しているときは、両方が了解を押すまで進みません。
     ひとりのときだけ3秒で自動的に進みます。 */
  var PAUSE_MS = 3000;
  var STUCK_MS = 30000;

  function pauseDuo(){ return !!(S.room && R.seats && R.seats.length >= 2); }

  function pauseStart(){
    if (S.pause && S.pause.r === S.round) return;
    pauseClear();
    var duo = pauseDuo();
    S.pause = {r: S.round, acks: {}, duo: duo, timer: null, late: null, stuck: false};
    if (duo){
      // 相手が戻ってこないときのために、しばらくしたら手動で進める道を出す
      S.pause.late = setTimeout(function(){
        if (S.pause){ S.pause.stuck = true; render(null); }
      }, STUCK_MS);
    } else {
      S.pause.timer = setTimeout(pauseGo, PAUSE_MS);
    }
    render(null);
  }
  function pauseClear(){
    if (S.pause){
      if (S.pause.timer) clearTimeout(S.pause.timer);
      if (S.pause.late) clearTimeout(S.pause.late);
    }
    S.pause = null;
  }
  function pauseGo(){
    pauseClear();
    if (!S.end || S.matchOver) return;
    nextRound();
    if (S.link) linkSave();
  }
  function pauseAck(){
    if (!S.pause) return;
    S.pause.acks[ME] = 1;
    if (S.room) roomSend({t:"ok", r: S.pause.r});
    render(null);
    pauseCheck();
  }
  function pauseMine(){ return !!(S.pause && S.pause.acks && S.pause.acks[ME]); }
  function pauseNeed(){ return (S.pause && S.pause.duo) ? 2 : 1; }
  function pauseHave(){
    var n = 0, k;
    if (S.pause) for (k in S.pause.acks) n++;
    return n;
  }
  function pauseCheck(){
    if (!S.pause) return;
    if (pauseHave() >= pauseNeed()) pauseGo();
  }

  document.getElementById("autoShare").addEventListener("click", function(){
    var url = location.href.split("#")[0];
    var payload = "十三星の盤で対戦しませんか。このリンクを開くとすぐ始められます\n" + url;
    if (navigator.share){
      navigator.share({title:"十三星の盤", text:payload}).then(function(){}, function(){});
    } else if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        S.autoMsg = "URLをコピーしました。相手に送ってください。"; render(null);
      }, function(){ S.autoMsg = url; render(null); });
    } else { S.autoMsg = url; render(null); }
  });
  document.getElementById("autoNew").addEventListener("click", autoReset);
  document.getElementById("autoSolo").addEventListener("click", function(){
    entrySet(""); gateShow("");
  });

  /* ---- 最初の画面のボタン ---- */
  document.getElementById("gJoin").addEventListener("click", function(){
    entrySet("room"); startRoom();
  });
  document.getElementById("gWord").addEventListener("keydown", function(ev){
    if (ev.key === "Enter"){ ev.preventDefault(); entrySet("room"); startRoom(); }
  });
  document.getElementById("gMake").addEventListener("click", function(){
    document.getElementById("gWord").value = makeWord();
    document.getElementById("gWord").focus();
  });
  document.getElementById("gArt").addEventListener("click", function(){
    entrySet("artifact"); gateHide(); startArtifact();
  });
  document.getElementById("gCpu1").addEventListener("click", function(){ entrySet("cpu1"); startCpu(1); });
  document.getElementById("gCpu2").addEventListener("click", function(){ entrySet("cpu2"); startCpu(2); });
  document.getElementById("gCpu0").addEventListener("click", function(){ entrySet("duo"); startCpu(0); });

  /* ---- 合言葉カードのボタン ---- */
  document.getElementById("resOk").addEventListener("click", pauseAck);
  document.getElementById("resGo").addEventListener("click", pauseGo);

  /* ---- 最初の画面の詳細設定 ---- */
  document.getElementById("gModeStep").addEventListener("click", function(){ setMode("step"); saveSettings(); });
  document.getElementById("gModeSlide").addEventListener("click", function(){ setMode("slide"); saveSettings(); });
  document.getElementById("gModeFree").addEventListener("click", function(){ setMode("free"); saveSettings(); });
  document.getElementById("gPreset").addEventListener("click", function(){
    for (var k in PRESET) RULES[k] = PRESET[k];
    RULES.mode = "step";
    applyRules(); syncToggles(); setMode(RULES.mode); saveSettings();
  });
  document.getElementById("gClkOn").addEventListener("click", function(){
    CLK.on = !CLK.on; clkSave(); clkSyncUI();
  });
  document.getElementById("gClkBase").addEventListener("change", function(){
    CLK.base = Number(this.value) || 600; clkSave(); clkSyncUI();
  });
  document.getElementById("gClkInc").addEventListener("change", function(){
    CLK.inc = Number(this.value) || 0; clkSave(); clkSyncUI();
  });

  /* ---- 持ち時間 ---- */
  document.getElementById("clkOn").addEventListener("click", function(){
    CLK.on = !CLK.on; clkSave(); clkSyncUI();
    if (S.room) roomNew(); else if (S.auto) autoPushRules(); else reset();
  });
  document.getElementById("clkBase").addEventListener("change", function(){
    CLK.base = Number(this.value) || 600; clkSave(); clkSyncUI();
    if (S.room) roomNew(); else if (S.auto) autoPushRules(); else reset();
  });
  document.getElementById("clkInc").addEventListener("change", function(){
    CLK.inc = Number(this.value) || 0; clkSave(); clkSyncUI();
    if (S.room) roomNew(); else if (S.auto) autoPushRules(); else reset();
  });

  /* ---- 自由移動はデバッグ用。?debug=1 のときだけ出す ---- */
  (function(){
    var dbg = false;
    try { dbg = /(^|[?&])debug=1/.test(location.search) || /debug/.test(location.hash); } catch(e){}
    if (!dbg){
      document.getElementById("modeFree").style.display = "none";
      document.getElementById("gModeFree").style.display = "none";
      if (RULES.mode === "free"){ setMode("step"); saveSettings(); }
    }
  })();

  document.getElementById("homeBtn").addEventListener("click", function(){
    entrySet(""); gateShow("");
  });
  document.getElementById("roomNew").addEventListener("click", roomNew);
  document.getElementById("roomHome").addEventListener("click", function(){
    entrySet(""); gateShow("");
  });
  document.getElementById("roomShare").addEventListener("click", function(){
    var url = location.href.split("#")[0];
    var payload = "十三星の盤で対戦しませんか。\nこのページを開いて、合言葉「" + R.word +
                  "」を入れてください。\n" + url;
    if (navigator.share){
      navigator.share({title:"十三星の盤", text:payload}).then(function(){}, function(){});
    } else if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(payload).then(function(){
        S.roomMsg = "案内文をコピーしました。相手に送ってください。"; render(null);
      }, function(){ S.roomMsg = payload; render(null); });
    } else { S.roomMsg = payload; render(null); }
  });

  handleHash();
  window.addEventListener("hashchange", handleHash);
  try {
    var qr = new URLSearchParams(location.search).get("room");
    if (qr && (location.protocol === "http:" || location.protocol === "https:")){
      document.getElementById("srvRoom").value = qr;
      setTimeout(srvJoin, 80);
    }
  } catch(e){}
  clkLoad(); clkSyncUI(); clkStart();
  bootEntry();
  if (!humanTurn()) setTimeout(cpuMove, 400);
})();
</script>
</body>
</html>
